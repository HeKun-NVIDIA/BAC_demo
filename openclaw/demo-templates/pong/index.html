<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ping-Pong</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
/* ==================== 作品设计 开始 ==================== */
const DESIGN = {
  title: "霓虹乒乓",
  // 屏幕底部的操作提示
  helpText: "W/S 或 ↑/↓ 移动球拍　空格 暂停　R 重新开始",
  colors: {
    // 背景
    background: "#070b1e",
    // 边框与中线
    court: "#26306a",
    // 玩家球拍（左）
    player: "#36f1ff",
    // 电脑球拍（右）
    computer: "#ff4fa3",
    ball: "#ffffff",
    text: "#e8ecff",
  },
  // 先到几分获胜
  winScore: 7,
  // 发球速度（像素/秒）
  ballSpeed: 380,
  // 玩家球拍速度
  paddleSpeed: 460,
  // 电脑球拍最大速度，越大越难
  computerSpeed: 300,
  paddleHeight: 100,
  // 霓虹发光
  glow: true,

  // ---- 升级功能 ----
  // 开始菜单与难度选择（← → / A D 选择，Enter / 空格开始）
  menu: false,
  difficulties: [
    { name: "简单", computerSpeed: 220, ballSpeed: 330 },
    { name: "普通", computerSpeed: 320, ballSpeed: 400 },
    { name: "困难", computerSpeed: 470, ballSpeed: 470 },
  ],
  // 每次击球后球速倍数，1 为不加速，例如 1.06
  speedUp: 1.0,
  maxBallSpeed: 900,
  // 击球、碰墙、得分音效
  sound: false,
  // 击球与得分粒子
  particles: false,
  // 击球屏幕震动
  screenShake: false,
  // 球的拖尾
  trail: false,
};
/* ==================== 作品设计 结束 ==================== */

const W = 960, H = 540;
const C = DESIGN.colors;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
document.title = DESIGN.title;
document.body.style.background = C.background;
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = `${W * s}px`;
  canvas.style.height = `${H * s}px`;
};
addEventListener("resize", fit);
fit();

// ---------- 输入 ----------
const keys = new Set();
const pressed = new Set();
const GAME_KEYS = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter"]);
addEventListener("keydown", (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
  unlockAudio();
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
const held = (...codes) => codes.some((c) => keys.has(c));
const tapped = (...codes) => codes.some((c) => pressed.has(c));

// ---------- 音效 ----------
let audio = null;
function unlockAudio() {
  if (!DESIGN.sound) return;
  if (!audio) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audio = new Ctx();
  }
  if (audio && audio.state === "suspended") audio.resume();
}
const SOUNDS = {
  hit: [["square", 660, 880, 0.08, 0.14]],
  wall: [["triangle", 330, 300, 0.06, 0.12]],
  score: [["sine", 523, 523, 0.1, 0.16], ["sine", 784, 784, 0.16, 0.16, 0.1]],
  select: [["square", 440, 520, 0.05, 0.1]],
  start: [["sine", 392, 392, 0.08, 0.16], ["sine", 523, 523, 0.08, 0.16, 0.08], ["sine", 784, 784, 0.16, 0.16, 0.16]],
  win: [["sine", 523, 523, 0.12, 0.16], ["sine", 659, 659, 0.12, 0.16, 0.12], ["sine", 784, 784, 0.12, 0.16, 0.24], ["sine", 1047, 1047, 0.3, 0.16, 0.36]],
  lose: [["sawtooth", 300, 90, 0.5, 0.12]],
};
function sound(name) {
  if (!DESIGN.sound || !audio) return;
  for (const [type, from, to, dur, vol, delay = 0] of SOUNDS[name]) {
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
}

// ---------- 游戏状态 ----------
const left = { x: 40, y: H / 2, w: 14, h: DESIGN.paddleHeight, color: C.player };
const right = { x: W - 40, y: H / 2, w: 14, h: DESIGN.paddleHeight, color: C.computer };
const ball = { x: W / 2, y: H / 2, r: 9, vx: 0, vy: 0 };
const particles = [];
const trail = [];
let state = "menu"; // menu | serve | play | pause | over
let resumeState = "play";
let difficulty = 1;
let score = [0, 0];
let serveTimer = 0;
let serveDir = 1;
let shakeTime = 0;
let message = "";

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const current = () => {
  const d = DESIGN.menu ? DESIGN.difficulties[difficulty] : null;
  return { ballSpeed: d ? d.ballSpeed : DESIGN.ballSpeed, computerSpeed: d ? d.computerSpeed : DESIGN.computerSpeed };
};

function serve(dir, delay = 0.8) {
  Object.assign(ball, { x: W / 2, y: H / 2, vx: 0, vy: 0 });
  serveDir = dir;
  serveTimer = delay;
  trail.length = 0;
  state = "serve";
}
function launch() {
  const angle = (Math.random() * 0.8 - 0.4);
  const speed = current().ballSpeed;
  ball.vx = Math.cos(angle) * speed * serveDir;
  ball.vy = Math.sin(angle) * speed;
  state = "play";
}
function startMatch() {
  score = [0, 0];
  left.y = right.y = H / 2;
  particles.length = 0;
  serve(Math.random() < 0.5 ? 1 : -1, 0.5);
}
function restart() {
  if (DESIGN.menu) { state = "menu"; score = [0, 0]; Object.assign(ball, { x: W / 2, y: H / 2, vx: 0, vy: 0 }); }
  else startMatch();
}

function burst(x, y, color, count = 18) {
  if (!DESIGN.particles) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 80 + Math.random() * 260;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, max: 0.6, size: 2 + Math.random() * 3, color });
  }
}

function bounce(paddle) {
  const halfW = paddle.w / 2, halfH = paddle.h / 2;
  const nx = clamp(ball.x, paddle.x - halfW, paddle.x + halfW);
  const ny = clamp(ball.y, paddle.y - halfH, paddle.y + halfH);
  if ((ball.x - nx) ** 2 + (ball.y - ny) ** 2 > ball.r ** 2) return false;
  if ((paddle.x - ball.x) * ball.vx <= 0) return false;
  const offset = clamp((ball.y - paddle.y) / halfH, -1, 1);
  const speed = Math.min(DESIGN.maxBallSpeed, Math.hypot(ball.vx, ball.vy) * DESIGN.speedUp);
  const dir = ball.vx > 0 ? -1 : 1;
  const angle = offset * (Math.PI / 3);
  ball.vx = dir * Math.cos(angle) * speed;
  ball.vy = Math.sin(angle) * speed;
  ball.x = paddle.x + dir * (halfW + ball.r + 1);
  sound("hit");
  burst(ball.x, ball.y, paddle.color);
  if (DESIGN.screenShake) shakeTime = 0.12;
  return true;
}

function point(side) {
  score[side] += 1;
  sound("score");
  burst(side === 0 ? W - 30 : 30, ball.y, side === 0 ? C.player : C.computer, 40);
  if (score[side] >= DESIGN.winScore) {
    state = "over";
    message = side === 0 ? "你赢了！" : "电脑赢了";
    sound(side === 0 ? "win" : "lose");
  } else {
    serve(side === 0 ? 1 : -1);
  }
}

function update(dt) {
  if (tapped("KeyR")) { restart(); return; }
  if (state === "menu") {
    if (!DESIGN.menu) { startMatch(); return; }
    const n = DESIGN.difficulties.length;
    if (tapped("ArrowLeft", "KeyA")) { difficulty = (difficulty + n - 1) % n; sound("select"); }
    if (tapped("ArrowRight", "KeyD")) { difficulty = (difficulty + 1) % n; sound("select"); }
    if (tapped("Enter", "Space")) { sound("start"); startMatch(); }
    return;
  }
  if (state === "over") {
    if (tapped("Enter", "Space")) restart();
    return;
  }
  if (tapped("Space")) {
    if (state === "pause") state = resumeState;
    else { resumeState = state; state = "pause"; }
  }
  if (state === "pause") return;

  if (held("KeyW", "ArrowUp")) left.y -= DESIGN.paddleSpeed * dt;
  if (held("KeyS", "ArrowDown")) left.y += DESIGN.paddleSpeed * dt;
  const target = ball.vx > 0 ? ball.y : H / 2;
  const cs = current().computerSpeed;
  right.y += clamp(target - right.y, -cs * dt, cs * dt);
  for (const p of [left, right]) p.y = clamp(p.y, p.h / 2 + 8, H - p.h / 2 - 8);

  if (state === "serve") {
    serveTimer -= dt;
    if (serveTimer <= 0) launch();
    return;
  }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  if (ball.y < ball.r + 8 || ball.y > H - ball.r - 8) {
    ball.vy = -ball.vy;
    ball.y = clamp(ball.y, ball.r + 8, H - ball.r - 8);
    sound("wall");
  }
  bounce(left);
  bounce(right);
  if (DESIGN.trail) {
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 14) trail.shift();
  }
  if (ball.x < -20) point(1);
  else if (ball.x > W + 20) point(0);
}

// ---------- 绘制 ----------
function glow(color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = DESIGN.glow ? blur : 0;
}
function text(value, x, y, size, color = C.text, weight = 700) {
  ctx.font = `${weight} ${size}px system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(value, x, y);
}

function drawCourt() {
  ctx.strokeStyle = C.court;
  ctx.lineWidth = 3;
  ctx.strokeRect(6, 6, W - 12, H - 12);
  ctx.setLineDash([12, 14]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 12);
  ctx.lineTo(W / 2, H - 12);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.35;
  text(String(score[0]), W / 2 - 90, 70, 64, C.player);
  text(String(score[1]), W / 2 + 90, 70, 64, C.computer);
  ctx.globalAlpha = 1;
}

function drawPlay() {
  for (const p of [left, right]) {
    glow(p.color, 22);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 7);
    ctx.fill();
  }
  trail.forEach((t, i) => {
    ctx.globalAlpha = (i / trail.length) * 0.5;
    ctx.fillStyle = C.ball;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * (i / trail.length), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  glow(C.ball, 24);
  ctx.fillStyle = C.ball;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  if (DESIGN.speedUp > 1 && state === "play") {
    ctx.globalAlpha = 0.6;
    text(`球速 ${Math.round(Math.hypot(ball.vx, ball.vy))}`, W - 90, H - 28, 16, C.text, 500);
    ctx.globalAlpha = 1;
  }
  if (state === "serve") text("准备发球…", W / 2, H / 2 + 60, 22, C.text, 500);
}

function overlay(title, subtitle) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fillRect(0, 0, W, H);
  glow(C.player, 20);
  text(title, W / 2, H / 2 - 24, 56);
  ctx.shadowBlur = 0;
  text(subtitle, W / 2, H / 2 + 36, 22, C.text, 500);
}

function drawMenu() {
  glow(C.player, 30);
  text(DESIGN.title, W / 2, 120, 64);
  ctx.shadowBlur = 0;
  const n = DESIGN.difficulties.length;
  const cardW = 200, gap = 30;
  const startX = W / 2 - ((cardW + gap) * n - gap) / 2;
  DESIGN.difficulties.forEach((d, i) => {
    const x = startX + i * (cardW + gap);
    const active = i === difficulty;
    ctx.fillStyle = active ? C.player : "rgba(255,255,255,0.06)";
    ctx.globalAlpha = active ? 0.25 : 1;
    ctx.beginPath();
    ctx.roundRect(x, 220, cardW, 110, 14);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = active ? C.player : "rgba(255,255,255,0.2)";
    ctx.lineWidth = active ? 3 : 1.5;
    ctx.stroke();
    text(d.name, x + cardW / 2, 262, 30, active ? C.player : C.text);
    text(`电脑速度 ${d.computerSpeed}`, x + cardW / 2, 302, 15, C.text, 500);
  });
  text("← → 选择难度　Enter / 空格 开始", W / 2, 390, 22, C.text, 500);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.background;
  ctx.fillRect(0, 0, W, H);
  if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  if (state === "menu" && DESIGN.menu) { drawMenu(); return; }
  drawCourt();
  drawPlay();
  ctx.globalAlpha = 0.55;
  text(DESIGN.helpText, W / 2, H - 22, 15, C.text, 500);
  ctx.globalAlpha = 1;
  if (state === "pause") overlay("暂停", "按空格继续");
  if (state === "over") overlay(message, `${score[0]} : ${score[1]}　按 Enter 或 R 再来一局`);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
  }
  if (shakeTime > 0) shakeTime -= dt;
  render();
  pressed.clear();
  requestAnimationFrame(loop);
}
restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
